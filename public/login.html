<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Finewise AI - Authentication</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <style>
    .auth-wrapper {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: calc(100vh - 140px);
      padding: 2.5rem 1rem;
    }
    
    .auth-card {
      width: 100%;
      max-width: 450px;
      position: relative;
    }
    
    .auth-tabs {
      display: flex;
      border-bottom: 1px solid var(--glass-border);
      margin-bottom: 1.75rem;
    }
    
    .auth-tab {
      flex: 1;
      padding: 0.85rem 1rem;
      background: transparent;
      border: none;
      color: var(--text-secondary);
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
      transition: var(--transition);
      border-bottom: 2px solid transparent;
      font-family: var(--font-family);
    }
    
    .auth-tab:hover {
      color: var(--text-primary);
    }

    /* Client tab active */
    .auth-tab.active {
      color: #c084fc;
      border-bottom-color: var(--accent-purple);
    }

    /* Admin theme overrides */
    .auth-card.admin-theme {
      border-color: rgba(239, 68, 68, 0.35) !important;
      box-shadow: 0 10px 35px 0 rgba(239, 68, 68, 0.15) !important;
    }

    .auth-card.admin-theme .auth-tab.active {
      color: #f87171 !important;
      border-bottom-color: #ef4444 !important;
    }

    .role-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.3rem 0.75rem;
      font-size: 0.775rem;
      font-weight: 700;
      border-radius: 9999px;
      margin-bottom: 0.85rem;
    }

    .role-badge.client-badge {
      background: rgba(139, 92, 246, 0.15);
      color: #c084fc;
      border: 1px solid rgba(139, 92, 246, 0.3);
    }

    .role-badge.admin-badge {
      background: rgba(239, 68, 68, 0.15);
      color: #f87171;
      border: 1px solid rgba(239, 68, 68, 0.3);
    }

    .input-hint {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-top: 0.35rem;
    }
  </style>
</head>
<body>

  <!-- Sticky Navigation Bar -->
  <nav class="navbar">
    <a href="/" class="logo">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 2L2 7L12 12L22 7L12 2Z" stroke="url(#logoGrad)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M2 17L12 22L22 17" stroke="url(#logoGrad)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M2 12L12 17L22 12" stroke="url(#logoGrad)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
        <defs>
          <linearGradient id="logoGrad" x1="2" y1="2" x2="22" y2="22" gradientUnits="userSpaceOnUse">
            <stop stop-color="#8B5CF6"/>
            <stop offset="1" stop-color="#EC4899"/>
          </linearGradient>
        </defs>
      </svg>
      Finewise AI
    </a>

    <div class="nav-links">
      <a href="/" class="nav-link">Home</a>
      <a href="/login.html?role=client" class="nav-link" id="nav-client-link">Client Portal</a>
      <a href="/login.html?role=admin" class="nav-link" id="nav-admin-link">Admin Access</a>
    </div>

    <!-- Mobile Hamburger Button -->
    <button class="hamburger-btn" onclick="toggleMobileNav()" aria-label="Toggle Menu">
      ☰
    </button>
  </nav>

  <!-- Mobile Drawer Menu -->
  <div class="mobile-menu-drawer" id="mobile-menu">
    <a href="/" class="nav-link">Home</a>
    <a href="/login.html?role=client" class="nav-link" id="mobile-client-link">Client Portal</a>
    <a href="/login.html?role=admin" class="nav-link" id="mobile-admin-link">Admin Access</a>
  </div>

  <div class="container">
    <div class="auth-wrapper">
      <div class="glass-card auth-card" id="auth-card-el">
        
        <!-- Auth Tabs (Login / Register) -->
        <div class="auth-tabs">
          <button class="auth-tab active" id="tab-login" onclick="switchTab('login')">Sign In</button>
          <button class="auth-tab" id="tab-register" onclick="switchTab('register')">Register</button>
        </div>

        <div id="alert-container"></div>

        <!-- Role Badge & Header -->
        <div style="text-align: center; margin-bottom: 1.5rem;">
          <div id="role-badge-el" class="role-badge client-badge">✨ Client Workspace</div>
          <h2 id="auth-heading" style="font-size: 1.5rem; font-weight: 700; letter-spacing: -0.02em; margin-bottom: 0.35rem;">Client Portal Sign In</h2>
          <p id="auth-subtext" style="font-size: 0.825rem; color: var(--text-secondary);">Access your personalized financial intelligence dashboard</p>
        </div>

        <!-- Authentication Form -->
        <form id="auth-form" onsubmit="handleAuthSubmit(event)">
          <div class="form-group">
            <label class="form-label" for="username">
              <span>Username</span>
              <span style="font-size: 0.75rem; color: var(--text-muted);">Min. 3 characters</span>
            </label>
            <input 
              type="text" 
              id="username" 
              class="form-control" 
              placeholder="e.g., johndoe" 
              required 
              autocomplete="username" 
              minlength="3">
          </div>
          
          <div class="form-group">
            <label class="form-label" for="password">
              <span>Password</span>
              <span style="font-size: 0.75rem; color: var(--text-muted);">Min. 6 characters</span>
            </label>
            <div class="password-field-wrapper">
              <input 
                type="password" 
                id="password" 
                class="form-control" 
                placeholder="Enter your password" 
                required 
                autocomplete="current-password" 
                minlength="6">
              <button type="button" class="password-toggle-btn" onclick="togglePasswordVisibility()" aria-label="Toggle password visibility">
                <span id="eye-icon">👁️</span>
              </button>
            </div>
            <div style="text-align: right; margin-top: 0.45rem;" id="forgot-password-container">
              <a href="/forgot-password.html" class="nav-link" id="forgot-password-link" style="font-size: 0.775rem; color: var(--text-muted); text-decoration: none; padding: 0;">Forgot Password?</a>
            </div>
          </div>

          <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;" id="submit-btn">
            <span id="btn-text">Sign In to Dashboard</span>
          </button>
        </form>

      </div>
    </div>
  </div>

  <script>
    let activeTab = 'login';
    let activeRole = null;

    // 1. Enforce query param validation immediately
    const params = new URLSearchParams(window.location.search);
    const roleParam = params.get('role');

    if (roleParam !== 'client' && roleParam !== 'admin') {
      // Missing or invalid role param -> redirect back to landing page
      window.location.replace('/');
    } else {
      activeRole = roleParam;
    }

    function toggleMobileNav() {
      const menu = document.getElementById('mobile-menu');
      menu.classList.toggle('open');
    }

    function togglePasswordVisibility() {
      const pwdInput = document.getElementById('password');
      const eyeIcon = document.getElementById('eye-icon');
      if (pwdInput.type === 'password') {
        pwdInput.type = 'text';
        eyeIcon.textContent = '🔒';
      } else {
        pwdInput.type = 'password';
        eyeIcon.textContent = '👁️';
      }
    }

    // Set up portal theme and auto-redirect authenticated sessions
    window.addEventListener('DOMContentLoaded', () => {
      // Auto-redirect if user already has an active session
      const token = localStorage.getItem('token');
      const role = localStorage.getItem('role');
      if (token && role) {
        window.location.href = (role === 'admin' || role === 'superior') ? '/admin.html' : '/client.html';
        return;
      }

      applyRoleTheme(activeRole);
    });

    function applyRoleTheme(role) {
      const card = document.getElementById('auth-card-el');
      const heading = document.getElementById('auth-heading');
      const subtext = document.getElementById('auth-subtext');
      const badge = document.getElementById('role-badge-el');
      const submitBtn = document.getElementById('submit-btn');
      const btnText = document.getElementById('btn-text');
      const navClient = document.getElementById('nav-client-link');
      const navAdmin = document.getElementById('nav-admin-link');

      if (role === 'admin') {
        document.title = 'Finewise AI - Administrator Access';
        card.classList.add('admin-theme');
        badge.className = 'role-badge admin-badge';
        badge.innerHTML = '🛡️ Administrator Access';
        
        heading.style.background = 'linear-gradient(135deg, #ffffff, #f87171)';
        heading.style.webkitBackgroundClip = 'text';
        heading.style.webkitTextFillColor = 'transparent';
        heading.textContent = activeTab === 'login' ? 'Administrator Sign In' : 'Administrator Registration';
        
        subtext.textContent = 'Restricted system auditor controls & risk management';
        btnText.textContent = activeTab === 'login' ? 'Sign In as Administrator' : 'Register Administrator';
        
        submitBtn.style.background = 'linear-gradient(135deg, #ef4444, #f87171)';
        submitBtn.style.boxShadow = '0 4px 15px rgba(239, 68, 68, 0.3)';

        if (navAdmin) navAdmin.classList.add('active');
        if (navClient) navClient.classList.remove('active');
      } else {
        document.title = 'Finewise AI - Client Portal';
        card.classList.remove('admin-theme');
        badge.className = 'role-badge client-badge';
        badge.innerHTML = '✨ Client Workspace';

        heading.style.background = 'linear-gradient(135deg, #ffffff, #a78bfa)';
        heading.style.webkitBackgroundClip = 'text';
        heading.style.webkitTextFillColor = 'transparent';
        heading.textContent = activeTab === 'login' ? 'Client Portal Sign In' : 'Client Registration';

        subtext.textContent = 'Access your personalized financial intelligence dashboard';
        btnText.textContent = activeTab === 'login' ? 'Sign In to Dashboard' : 'Register as Client';

        submitBtn.style.background = 'linear-gradient(135deg, var(--accent-purple), var(--accent-pink))';
        submitBtn.style.boxShadow = '0 4px 15px rgba(139, 92, 246, 0.25)';

        if (navClient) navClient.classList.add('active');
        if (navAdmin) navAdmin.classList.remove('active');
      }

      const forgotLink = document.getElementById('forgot-password-link');
      const forgotContainer = document.getElementById('forgot-password-container');
      if (forgotLink) {
        forgotLink.href = `/forgot-password.html?role=${role}`;
      }
      if (forgotContainer) {
        forgotContainer.style.display = activeTab === 'login' ? 'block' : 'none';
      }
    }

    function switchTab(tab) {
      activeTab = tab;
      document.getElementById('tab-login').classList.toggle('active', tab === 'login');
      document.getElementById('tab-register').classList.toggle('active', tab === 'register');
      
      applyRoleTheme(activeRole);
      document.getElementById('alert-container').innerHTML = '';
    }

    async function handleAuthSubmit(event) {
      event.preventDefault();
      
      const usernameInput = document.getElementById('username');
      const passwordInput = document.getElementById('password');
      const alertContainer = document.getElementById('alert-container');
      const submitBtn = document.getElementById('submit-btn');
      const btnText = document.getElementById('btn-text');
      
      // Loading State
      submitBtn.disabled = true;
      btnText.innerHTML = '<span class="spinner"></span> Authenticating...';
      alertContainer.innerHTML = '';
      
      const payload = {
        username: usernameInput.value.trim(),
        password: passwordInput.value,
        role: activeRole
      };
      
      const url = activeTab === 'login' ? '/api/auth/login' : '/api/auth/register';
      
      try {
        const response = await fetch(url, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify(payload)
        });
        
        const data = await response.json();
        
        if (!response.ok) {
          throw new Error(data.error || 'Authentication failed. Please check your credentials.');
        }
        
        if (activeTab === 'login') {
          localStorage.setItem('token', data.token);
          localStorage.setItem('role', data.role);
          localStorage.setItem('username', data.username);
          
          alertContainer.innerHTML = `
            <div class="alert alert-success">
              <span>✅</span> Access granted. Redirecting to dashboard...
            </div>
          `;
          
          setTimeout(() => {
            if (data.role === 'admin' || data.role === 'superior') {
              window.location.href = '/admin.html';
            } else {
              window.location.href = '/client.html';
            }
          }, 700);
          
        } else {
          alertContainer.innerHTML = `
            <div class="alert alert-success">
              <span>🎉</span> Registration successful! Please sign in below.
            </div>
          `;
          switchTab('login');
          passwordInput.value = '';
          submitBtn.disabled = false;
          applyRoleTheme(activeRole);
        }
      } catch (err) {
        alertContainer.innerHTML = `
          <div class="alert alert-danger">
            <span>❌</span> ${err.message}
          </div>
        `;
        submitBtn.disabled = false;
        applyRoleTheme(activeRole);
      }
    }
  </script>
</body>
</html>
